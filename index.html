<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algebra Practise</title>
    <style>
        :root { --primary: #2563eb; --dark: #0f172a; --card-bg: #1e293b; --text: #f8fafc; }
        body { font-family: sans-serif; background-color: var(--dark); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { padding: 2rem; text-align: center; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; width: 90%; max-width: 1100px; padding: 20px; }
        .game-card { background: var(--card-bg); border-radius: 12px; padding: 25px; text-align: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: 0.2s; }
        .game-card:hover { transform: translateY(-5px); border-color: var(--primary); background: #2d3a4f; }
        #game-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; }
        iframe { width: 100%; height: 100%; border: none; }
        .ui-bar { position: absolute; top: 10px; right: 10px; display: flex; gap: 10px; z-index: 10000; }
        .btn { padding: 10px 15px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; color: white; }
        .btn-fs { background: var(--primary); }
        .btn-close { background: #ef4444; }
    </style>
</head>
<body>

<header>
    <h1>Algebra Practise</h1>
    <p>Select a lesson to begin</p>
</header>

<div class="game-grid" id="grid"></div>

<div id="game-overlay">
    <div class="ui-bar">
        <button class="btn btn-fs" onclick="openFS()">Fullscreen</button>
        <button class="btn btn-close" onclick="closeGame()">Close</button>
    </div>
    <iframe id="loader" src=""></iframe>
</div>

<script>
    // THE GAME LIST
    const games = [
        { n: "Flappy Bird", p: "games/flap bird.html" },
        { n: "Escape Road", p: "games/clescaperoad.html" },
        { n: "Poly Old", p: "games/clpolyold.html" },
        { n: "Slice It All", p: "games/Slice it All.html" },
        { n: "GD Lite", p: "games/clgdlite.html" },
        { n: "Snow Rider", p: "games/clsnowriderrrr.html" },
        { n: "Short Life", p: "games/clshortlife.html" },
        { n: "Tunnel Rush", p: "games/cltunnelrushbetter.html" },
        { n: "Wheelie Bike", p: "games/clwheeliebike.html" }
    ];

    const grid = document.getElementById('grid');
    const overlay = document.getElementById('game-overlay');
    const loader = document.getElementById('loader');

    // This creates the buttons on the screen
    games.forEach(game => {
        const div = document.createElement('div');
        div.className = 'game-card';
        div.innerHTML = `<h3>${game.n}</h3>`;
        div.onclick = () => {
            loader.src = game.p;
            overlay.style.display = 'block';
        };
        grid.appendChild(div);
    });

    function closeGame() {
        overlay.style.display = 'none';
        loader.src = '';
    }

    function openFS() {
        if (loader.requestFullscreen) loader.requestFullscreen();
        else if (loader.webkitRequestFullscreen) loader.webkitRequestFullscreen();
    }
</script>
</body>
</html>
