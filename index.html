<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algebra Practise</title>
    <style>
        :root {
            --primary: #2563eb;
            --dark: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--dark);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            padding: 3rem 1rem;
            text-align: center;
        }

        h1 { margin: 0; font-size: 2.5rem; letter-spacing: -1px; }
        p { opacity: 0.7; margin-top: 0.5rem; }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1100px;
            padding-bottom: 50px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .game-card:hover {
            transform: translateY(-8px);
            background: #2d3a4f;
            border-color: var(--primary);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
        }

        .game-card h3 { margin: 0; font-size: 1.1rem; }
